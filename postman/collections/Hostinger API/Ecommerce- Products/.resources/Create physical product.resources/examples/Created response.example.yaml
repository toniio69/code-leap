$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/products/physical"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store to create the product in.
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "price": "<integer>",
        "description": "<string>",
        "currency": "<string>"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "product": {
          "id": "<string>",
          "title": "<string>",
          "type": "physical",
          "status": "<string>",
          "price": "<integer>",
          "currency_code": "<string>"
        },
        "admin_url": "<string>"
      }
order: 1000
