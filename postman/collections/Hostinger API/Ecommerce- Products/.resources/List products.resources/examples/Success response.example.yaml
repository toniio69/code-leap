$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/products?product_ids=<string>&status=archived&q=<string>&include=variants&page=<integer>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: product_ids
      value: <string>
      description: Restrict to these product ids. Doubles as a single-product lookup. Up to 200 ids.
    - key: status
      value: archived
      description: Product statuses to include.
    - key: q
      value: <string>
      description: Free-text search over product title and SKU.
    - key: include
      value: variants
      description: "Opt-in heavy data: \"variants\" embeds each product's variants; \"media\" embeds its media."
    - key: page
      value: <integer>
      description: Page number
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store to list products for.
