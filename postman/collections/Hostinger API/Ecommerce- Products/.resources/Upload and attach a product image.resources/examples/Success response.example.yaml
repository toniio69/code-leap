$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/products/:product_id/images"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store the product belongs to.
    - key: product_id
      value: <string>
      description: (Required) The ID of the product to attach the image to.
  body:
    type: json
    content: |-
      {
        "image_url": "<string>",
        "object_name": "<string>",
        "is_thumbnail": "<boolean>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "url": "<string>",
        "is_thumbnail": "<boolean>"
      }
order: 1000
