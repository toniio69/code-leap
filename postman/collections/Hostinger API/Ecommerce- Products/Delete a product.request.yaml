$kind: http-request
description: |-
  Delete a product and its variants from the store. A subscription product with active
  subscribers is archived instead of deleted so its data stays available.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/products/:product_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store that owns the product.
  - key: product_id
    value: <string>
    description: (Required) The ID of the product to delete.
settings: {}
examples: ./.resources/Delete a product.resources/examples
order: 2000
