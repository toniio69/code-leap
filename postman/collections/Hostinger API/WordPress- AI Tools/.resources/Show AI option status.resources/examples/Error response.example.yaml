$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/hostinger-plugins/ai-option/status?option=web2agent"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: option
      value: web2agent
      description: Filter the status by a single AI option. (This can only be one of llmstxt,web2agent)
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: software
      value: "98"
      description: (Required) WordPress installation (software) identifier
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
