$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/orders/:order_id/resource-usage-metrics?time_frame_hours=24"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: time_frame_hours
      value: "24"
      description: Length of the window in hours, ending now. Bucket size grows with the window. (This can only be one of 1,24,168,336,720)
  pathVariables:
    - key: order_id
      value: <integer>
      description: (Required) Agency Plan order ID
