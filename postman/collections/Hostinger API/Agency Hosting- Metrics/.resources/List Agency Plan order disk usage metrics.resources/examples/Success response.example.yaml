$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/orders/:order_id/disk-usage-metrics?time_frame_days=1"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: time_frame_days
      value: "1"
      description: Length of the window in days, ending now. Bucket size grows with the window. (This can only be one of 1,7,14,30)
  pathVariables:
    - key: order_id
      value: <integer>
      description: (Required) Agency Plan order ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "limits": {
          "disk_bytes": "<integer>",
          "inodes": "<integer>"
        },
        "metrics": [
          {
            "disk_bytes": "<integer>",
            "inodes": "<integer>",
            "timestamp": "<integer>"
          },
          {
            "disk_bytes": "<integer>",
            "inodes": "<integer>",
            "timestamp": "<integer>"
          }
        ]
      }
order: 1000
