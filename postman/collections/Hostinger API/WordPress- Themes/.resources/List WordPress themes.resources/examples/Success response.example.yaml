$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/wordpress/themes?order_id=<integer>&search=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: order_id
      value: <integer>
      description: Optionally scope themes to a specific order.
    - key: search
      value: <string>
      description: Search term to match against theme names.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "slug": "<string>",
          "title": "<string>",
          "url": "<string>",
          "featured_image_url": "<string>",
          "full_image_url": "<string>",
          "description": "<string>",
          "logo_url": "<string>",
          "is_plan_upgrade_needed": "<boolean>"
        },
        {
          "slug": "<string>",
          "title": "<string>",
          "url": "<string>",
          "featured_image_url": "<string>",
          "full_image_url": "<string>",
          "description": "<string>",
          "logo_url": "<string>",
          "is_plan_upgrade_needed": "<boolean>"
        }
      ]
