$kind: http-example
request:
  url: "{{baseUrl}}/api/domains/v1/portfolio/claim"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "domain": "<string>",
        "domain_contacts": {
          "owner_id": "<integer>",
          "admin_id": "<integer>",
          "billing_id": "<integer>",
          "tech_id": "<integer>"
        },
        "additional_details": {}
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "domain": "<string>",
        "status": "pending_setup",
        "created_at": "<dateTime>"
      }
order: 1000
