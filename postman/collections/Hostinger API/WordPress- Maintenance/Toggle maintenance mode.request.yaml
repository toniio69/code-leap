$kind: http-request
description: |-
  Enable or disable maintenance mode for the specified WordPress installation,
  based on the `enabled` flag.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/maintenance/toggle"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
body:
  type: json
  content: |-
    {
      "enabled": "<boolean>"
    }
settings: {}
examples: ./.resources/Toggle maintenance mode.resources/examples
order: 2000
