$kind: http-request
description: |-
  Retrieve the transfer for a specified domain.

  Use this endpoint to track an incoming or outgoing registrar transfer and its status.
url: "{{baseUrl}}/api/domains/v1/transfers/:domain"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: domain
    value: <string>
    description: (Required) Domain name
settings: {}
examples: ./.resources/Get transfer.resources/examples
order: 2000
