$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/litespeed-cache/status"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: software
      value: "98"
      description: (Required) WordPress installation (software) identifier
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "is_installed": "<boolean>",
        "is_active": "<boolean>"
      }
order: 1000
