$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/orders/:orderId/mailboxes?search=<string>&sort=address&page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: search
      value: <string>
      description: Filter mailboxes whose email address contains the given string
    - key: sort
      value: address
      description: Sort mailboxes by field. Prefix with `-` for descending order. (This can only be one of address,-address)
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
  pathVariables:
    - key: orderId
      value: <string>
      description: (Required) Order resource ID
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
