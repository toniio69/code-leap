$kind: http-example
name: Error response
request:
  url: "{{baseUrl}}/api/mail/v1/mailboxes/:mailboxId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: mailboxId
      value: <string>
      description: (Required) Mailbox resource ID
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 4000
