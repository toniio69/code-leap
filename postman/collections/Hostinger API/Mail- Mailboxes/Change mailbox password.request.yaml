$kind: http-request
description: Change the password of a mailbox.
url: "{{baseUrl}}/api/mail/v1/mailboxes/:mailboxId/password"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: mailboxId
    value: <string>
    description: (Required) Mailbox resource ID
body:
  type: json
  content: |-
    {
      "password": "<string>"
    }
settings: {}
examples: ./.resources/Change mailbox password.resources/examples
order: 4000
