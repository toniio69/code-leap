$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/tags/:tagUuid/contacts/:contactUuid"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
    - key: tagUuid
      value: <uuid>
      description: (Required) Tag uuid parameter
    - key: contactUuid
      value: <uuid>
      description: (Required) Contact uuid parameter
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "<string>",
        "type": "custom",
        "value": "<string>",
        "created_at": "<dateTime>"
      }
order: 1000
