$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/git/installations/:uuid/repositories"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: uuid
      value: <uuid>
      description: (Required) Git installation UUID from the List Git installations endpoint
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
