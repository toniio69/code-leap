$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/git/installations?provider=github&status=active"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: provider
      value: github
      description: Filter by Git provider (This can only be one of github,gitlab,bitbucket)
    - key: status
      value: active
      description: Filter by installation status (This can only be one of pending,active,suspended)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "uuid": "<string>",
          "provider": "github",
          "account_login": "<string>",
          "account_type": "Organization",
          "account_avatar_url": "<string>",
          "status": "pending",
          "installed_at": "<dateTime>",
          "created_at": "<dateTime>",
          "has_oauth": "<boolean>"
        },
        {
          "uuid": "<string>",
          "provider": "gitlab",
          "account_login": "<string>",
          "account_type": "User",
          "account_avatar_url": "<string>",
          "status": "active",
          "installed_at": "<dateTime>",
          "created_at": "<dateTime>",
          "has_oauth": "<boolean>"
        }
      ]
order: 1000
