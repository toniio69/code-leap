$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/git/installations?provider=github&status=active"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: provider
      value: github
      description: Filter by Git provider (This can only be one of github,gitlab,bitbucket)
    - key: status
      value: active
      description: Filter by installation status (This can only be one of pending,active,suspended)
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
