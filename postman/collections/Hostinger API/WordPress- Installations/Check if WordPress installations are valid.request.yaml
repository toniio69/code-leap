$kind: http-request
description: |-
  Check whether one or more WordPress installations are valid and working
  correctly. Detects broken installations caused by missing files, broken
  plugins, themes and similar issues.

  Provide the WordPress installation (software) identifiers in the body. They
  can be obtained from GET /api/hosting/v1/wordpress/installations (the `id`
  field).
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/installations/check-is-valid"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "software_ids": [
        "<string>"
      ],
      "force": false
    }
settings: {}
examples: ./.resources/Check if WordPress installations are valid.resources/examples
order: 1000
