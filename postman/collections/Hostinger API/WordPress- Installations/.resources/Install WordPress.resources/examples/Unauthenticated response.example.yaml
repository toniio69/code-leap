$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/installations"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "domain": "<string>",
        "site_title": "<string>",
        "credentials": {
          "email": "<string>",
          "login": "<string>",
          "password": "<string>"
        },
        "language": "<string>",
        "directory": "<string>",
        "overwrite": "<boolean>",
        "auto_updates": "none",
        "version": "<string>",
        "database": {
          "name": "<string>",
          "password": "<string>"
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
