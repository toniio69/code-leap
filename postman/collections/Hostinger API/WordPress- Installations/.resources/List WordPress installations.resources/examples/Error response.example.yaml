$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/wordpress/installations?username=<string>&domain=<string>&ownership=owned"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: username
      value: <string>
      description: Filter by specific username
    - key: domain
      value: <string>
      description: Filter by domain name (case-insensitive substring match)
    - key: ownership
      value: owned
      description: Filter by ownership type. Defaults to "owned". Use "all" to include both owned and managed installations. (This can only be one of owned,managed,all)
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
