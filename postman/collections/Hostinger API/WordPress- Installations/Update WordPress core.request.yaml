$kind: http-request
description: |-
  Update the WordPress core for the specified installation (minor update or a
  specific version).

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).

  This operation is asynchronous: a successful response only means the update
  job has been queued.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/update"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
body:
  type: json
  content: |-
    {
      "minor": false,
      "version": "<string>"
    }
settings: {}
examples: ./.resources/Update WordPress core.resources/examples
order: 10000
