$kind: http-request
description: |-
  Import WordPress website to the specified domain.

  WARNING: this overwrites the website's existing contents and cannot be undone —
  verify this is intended before calling this endpoint.

  This endpoint allows you to import a WordPress website from archive and
  database files that have been uploaded to the website's directory.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/websites/:domain/wordpress/import"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: domain
    value: <string>
    description: (Required) Domain name
body:
  type: json
  content: |-
    {
      "archive_path": "<string>",
      "sql_path": "<string>"
    }
settings: {}
examples: ./.resources/Import WordPress website.resources/examples
order: 4000
