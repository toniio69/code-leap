$kind: http-request
description: |-
  Return a JWT token used to authenticate requests against the specified
  WordPress installation, including its MCP (Model Context Protocol) endpoint.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/jwt-token"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
settings: {}
examples: ./.resources/Get installation JWT token.resources/examples
order: 8000
