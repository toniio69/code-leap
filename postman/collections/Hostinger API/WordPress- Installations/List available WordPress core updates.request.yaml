$kind: http-request
description: |-
  List available WordPress core updates for the specified installation.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/updates"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
settings: {}
examples: ./.resources/List available WordPress core updates.resources/examples
order: 7000
