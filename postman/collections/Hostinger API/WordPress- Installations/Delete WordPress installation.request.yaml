$kind: http-request
description: |-
  Delete the specified WordPress installation, with optional file and database
  removal. This removes all associated components including plugins, themes,
  staging websites and any other related data.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software"
method: DELETE
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
body:
  type: json
  content: |-
    {
      "delete_files": false,
      "delete_database": false
    }
settings: {}
examples: ./.resources/Delete WordPress installation.resources/examples
order: 2000
