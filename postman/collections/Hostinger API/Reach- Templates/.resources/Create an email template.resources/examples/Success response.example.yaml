$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/templates"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
  body:
    type: json
    content: |-
      {
        "template_content": "<string>",
        "title": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "<string>",
        "title": "<string>",
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>"
      }
order: 1000
