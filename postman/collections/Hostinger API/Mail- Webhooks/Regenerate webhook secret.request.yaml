$kind: http-request
description: |-
  Regenerate the secret of a webhook. The previous secret is
  immediately invalidated. The new secret is returned only in this
  response and is sent as a bearer token with every delivery.
url: "{{baseUrl}}/api/mail/v1/webhooks/:webhookId/regenerate-secret"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: webhookId
    value: <string>
    description: (Required) Webhook ID (returned when the webhook was created)
settings: {}
examples: ./.resources/Regenerate webhook secret.resources/examples
order: 7000
