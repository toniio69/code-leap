$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/orders/:orderId/webhooks/delivery-logs?mailbox_id=<string>&page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: mailbox_id
      value: <string>
      description: Filter by the mailbox resource ID the webhooks are attached to
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
  pathVariables:
    - key: orderId
      value: <string>
      description: (Required) Order resource ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "created_at": "<dateTime>",
            "mailbox_address": "<string>",
            "webhook_url": "<string>",
            "is_successful": "<boolean>",
            "duration": "<integer>",
            "retry_count": "<integer>",
            "max_retry_count": "<integer>"
          },
          {
            "created_at": "<dateTime>",
            "mailbox_address": "<string>",
            "webhook_url": "<string>",
            "is_successful": "<boolean>",
            "duration": "<integer>",
            "retry_count": "<integer>",
            "max_retry_count": "<integer>"
          }
        ],
        "meta": {
          "current_page": "<integer>",
          "per_page": "<integer>",
          "total": "<integer>"
        }
      }
order: 1000
