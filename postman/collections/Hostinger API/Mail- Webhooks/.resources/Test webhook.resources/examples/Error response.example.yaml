$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/webhooks/:webhookId/test"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: webhookId
      value: <string>
      description: (Required) Webhook ID (returned when the webhook was created)
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
