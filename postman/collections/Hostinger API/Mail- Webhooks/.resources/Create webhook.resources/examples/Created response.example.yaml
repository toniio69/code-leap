$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/mailboxes/:mailboxId/webhooks"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: mailboxId
      value: <string>
      description: (Required) Mailbox resource ID
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "events": [
          "message.received",
          "message.received"
        ],
        "url": "<string>",
        "description": "<string>",
        "status": "active"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<string>",
        "mailbox": {
          "id": "<string>",
          "address": "<string>"
        },
        "name": "<string>",
        "description": "<string>",
        "events": [
          "message.received",
          "message.received"
        ],
        "status": "paused",
        "url": "<string>",
        "secret": "<string>",
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>"
      }
order: 1000
