$kind: http-request
description: |-
  Retrieve a paginated list of webhooks belonging to the given mail
  order. Supports filtering by mailbox and status. The webhook secret
  is never included; it is returned only when a webhook is created or
  its secret is regenerated.
url: "{{baseUrl}}/api/mail/v1/orders/:orderId/webhooks?mailbox_id=<string>&status=disabled&page=<integer>&per_page=25"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: mailbox_id
    value: <string>
    description: Filter by the mailbox resource ID the webhooks are attached to
  - key: status
    value: disabled
    description: Filter webhooks by status (This can only be one of active,disabled,paused)
  - key: page
    value: <integer>
    description: Page number
  - key: per_page
    value: "25"
    description: Number of items per page
pathVariables:
  - key: orderId
    value: <string>
    description: (Required) Order resource ID
settings: {}
examples: ./.resources/List webhooks.resources/examples
order: 6000
