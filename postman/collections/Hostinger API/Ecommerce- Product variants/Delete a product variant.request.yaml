$kind: http-request
description: Delete a single variant from the product.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/products/:product_id/variants/:variant_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store that owns the product.
  - key: product_id
    value: <string>
    description: (Required) The ID of the product that owns the variant.
  - key: variant_id
    value: <string>
    description: (Required) The ID of the variant to delete.
settings: {}
examples: ./.resources/Delete a product variant.resources/examples
order: 2000
