$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/products/:product_id/variants"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store that owns the product.
    - key: product_id
      value: <string>
      description: (Required) The ID of the product to add the variant to.
  body:
    type: json
    content: |-
      {
        "options": [
          {
            "name": "<string>",
            "value": "<string>"
          }
        ],
        "title": "<string>",
        "sku": "<string>",
        "prices": [
          {
            "amount": "<integer>",
            "sale_amount": "<integer>",
            "currency": "<string>"
          }
        ],
        "inventory_quantity": "<integer>",
        "manage_inventory": "<boolean>"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "errors": {
          "field_1": [
            "",
            ""
          ],
          "field_2": [
            "",
            ""
          ]
        },
        "correlation_id": "<string>"
      }
order: 3000
