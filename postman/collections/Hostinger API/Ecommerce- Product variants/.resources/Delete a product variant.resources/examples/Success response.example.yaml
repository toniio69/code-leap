$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/products/:product_id/variants/:variant_id"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store that owns the product.
    - key: product_id
      value: <string>
      description: (Required) The ID of the product that owns the variant.
    - key: variant_id
      value: <string>
      description: (Required) The ID of the variant to delete.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "<string>",
          "is_deleted": "<boolean>"
        }
      }
order: 1000
