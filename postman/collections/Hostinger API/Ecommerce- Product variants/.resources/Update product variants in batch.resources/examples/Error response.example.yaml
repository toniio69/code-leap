$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/products/:product_id/variants/batch"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store that owns the product.
    - key: product_id
      value: <string>
      description: (Required) The ID of the product whose variants are being updated.
  body:
    type: json
    content: |-
      {
        "variants": [
          {
            "variant_id": "<string>",
            "title": "<string>",
            "inventory_quantity": "<integer>",
            "manage_inventory": "<boolean>",
            "prices": [
              {
                "amount": "<integer>",
                "sale_amount": "<integer>",
                "currency": "<string>"
              }
            ]
          }
        ]
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 4000
