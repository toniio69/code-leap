$kind: http-request
description: |-
  Get a single form with the URL of its hosted template and the tags it applies to the contacts
  it captures.

  There is no ready-made embed snippet in the response - either serve the template HTML yourself
  or build your own embed around the form uuid.
url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/forms/:formUuid"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: profileUuid
    value: <string>
    description: (Required) Profile uuid parameter
  - key: formUuid
    value: <string>
    description: (Required) Form uuid parameter
settings: {}
examples: ./.resources/Get form details.resources/examples
order: 1000
