$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/forms?page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "uuid": "<string>",
            "name": "<string>",
            "status": "active",
            "type": "form",
            "template": {
              "uuid": "<string>",
              "path": "<string>"
            },
            "created_at": "<dateTime>",
            "updated_at": "<dateTime>"
          },
          {
            "uuid": "<string>",
            "name": "<string>",
            "status": "paused",
            "type": "form",
            "template": {
              "uuid": "<string>",
              "path": "<string>"
            },
            "created_at": "<dateTime>",
            "updated_at": "<dateTime>"
          }
        ],
        "meta": {
          "current_page": "<integer>",
          "per_page": "<integer>",
          "total": "<integer>"
        }
      }
order: 1000
