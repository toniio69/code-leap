$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/features"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "feature": "SmartSending",
          "is_available": "<boolean>",
          "is_locked": "<boolean>"
        },
        {
          "feature": "TemplateCheckerAnalysis",
          "is_available": "<boolean>",
          "is_locked": "<boolean>"
        }
      ]
order: 1000
