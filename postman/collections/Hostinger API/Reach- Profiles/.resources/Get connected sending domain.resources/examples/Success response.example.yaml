$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/domains"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "domain": "<string>",
        "status": "active",
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>",
        "suspended_sender_emails": [
          {
            "email": "<string>",
            "email_local_part": "<string>",
            "suspended_at": "<dateTime>"
          },
          {
            "email": "<string>",
            "email_local_part": "<string>",
            "suspended_at": "<dateTime>"
          }
        ]
      }
order: 1000
