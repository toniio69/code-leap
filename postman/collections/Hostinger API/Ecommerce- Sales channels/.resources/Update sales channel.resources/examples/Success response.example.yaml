$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/sales-channels/:sales_channel_id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store that owns the sales channel.
    - key: sales_channel_id
      value: <string>
      description: (Required) The ID of the sales channel to update.
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "url": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "sales_channel": {
          "id": "<string>",
          "type": "custom",
          "is_primary": "<boolean>",
          "is_active": "<boolean>",
          "external_id": "<string>",
          "name": "<string>",
          "domain": "<string>"
        }
      }
order: 1000
