$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/sales-channels"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store to list sales channels for.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "sales_channels": [
          {
            "id": "<string>",
            "type": "custom",
            "is_primary": "<boolean>",
            "is_active": "<boolean>",
            "external_id": "<string>",
            "name": "<string>",
            "domain": "<string>"
          },
          {
            "id": "<string>",
            "type": "wordpress",
            "is_primary": "<boolean>",
            "is_active": "<boolean>",
            "external_id": "<string>",
            "name": "<string>",
            "domain": "<string>"
          }
        ]
      }
order: 1000
