$kind: http-request
description: |-
  Create a sales channel for a store. A "custom" channel is headless: build your own frontend and keep
  your catalog, orders, shipping and payments in sync through the Ecommerce API. A "quick-link" channel
  is a hosted one-page store whose handle is auto-generated.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/sales-channels"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store to create the sales channel for.
body:
  type: json
  content: |-
    {
      "type": "custom",
      "name": "<string>",
      "url": "<string>"
    }
settings: {}
examples: ./.resources/Create a sales channel.resources/examples
order: 2000
