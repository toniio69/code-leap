$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/websites/:domain/redirects?from=<uri>"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: from
      value: <uri>
      description: (Required) Source URL returned by the list redirects endpoint.
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: domain
      value: <string>
      description: (Required) Domain name
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 1000
