$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/api-tokens/:tokenId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: tokenId
      value: <string>
      description: (Required) API token ID (returned when the token was created)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 1000
