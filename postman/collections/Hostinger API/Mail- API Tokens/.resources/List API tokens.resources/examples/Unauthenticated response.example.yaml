$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/api-tokens?order_id=<string>&page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: order_id
      value: <string>
      description: Filter tokens by order resource ID. Single value or comma-separated list.
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
