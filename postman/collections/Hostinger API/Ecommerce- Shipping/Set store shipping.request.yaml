$kind: http-request
description: Set the flat-rate shipping price for a store, creating the shipping zone if it does not exist yet.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/shipping"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store to configure shipping for.
body:
  type: json
  content: |-
    {
      "price": "<integer>"
    }
settings: {}
examples: ./.resources/Set store shipping.resources/examples
order: 1000
