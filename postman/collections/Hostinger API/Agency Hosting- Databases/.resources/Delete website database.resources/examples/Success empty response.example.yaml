$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/websites/:website_uid/databases/:database_name"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: website_uid
      value: <string>
      description: (Required) Agency Plan website UID
    - key: database_name
      value: <string>
      description: (Required) Full database name as returned by the list databases endpoint.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 1000
