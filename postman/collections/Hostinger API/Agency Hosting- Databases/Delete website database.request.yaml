$kind: http-request
description: |-
  Permanently deletes a MySQL database and all its data from an Agency Plan website, including its users.

  The operation is idempotent: deleting a database that does not exist succeeds without error.
url: "{{baseUrl}}/api/agency-hosting/v1/websites/:website_uid/databases/:database_name"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: website_uid
    value: <string>
    description: (Required) Agency Plan website UID
  - key: database_name
    value: <string>
    description: (Required) Full database name as returned by the list databases endpoint.
settings: {}
examples: ./.resources/Delete website database.resources/examples
order: 3000
