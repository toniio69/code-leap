$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/websites?page=<integer>&per_page=25&order_ids=<integer>,<integer>&states=deleted,deleted&website_types=other,other&domain=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
    - key: order_ids
      value: <integer>,<integer>
      description: Filter by order IDs. Accepts a comma-separated list.
    - key: states
      value: deleted,deleted
      description: Filter by website state. Accepts a comma-separated list.
    - key: website_types
      value: other,other
      description: Filter by detected website type, e.g. wordpress,nodejs. Accepts a comma-separated list.
    - key: domain
      value: <string>
      description: Filter by domain name (case-insensitive substring match)
response:
