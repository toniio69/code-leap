$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/databases"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "user": "<string>",
        "password": "<string>",
        "website_domain": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 1000
