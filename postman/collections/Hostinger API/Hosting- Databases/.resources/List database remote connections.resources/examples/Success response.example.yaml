$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/databases/remote-connections?domain=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: domain
      value: <string>
      description: |-
        Filter remote connections by the domain the database is assigned to.
        Rules for databases not assigned to any domain are always included.
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "database_name": "<string>",
          "database_user": "<string>",
          "ip": "<string>"
        },
        {
          "database_name": "<string>",
          "database_user": "<string>",
          "ip": "<string>"
        }
      ]
order: 1000
