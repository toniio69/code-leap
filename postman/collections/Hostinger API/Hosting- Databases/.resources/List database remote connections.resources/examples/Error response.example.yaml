$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/databases/remote-connections?domain=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: domain
      value: <string>
      description: |-
        Filter remote connections by the domain the database is assigned to.
        Rules for databases not assigned to any domain are always included.
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
