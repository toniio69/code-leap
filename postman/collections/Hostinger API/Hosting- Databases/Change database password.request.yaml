$kind: http-request
description: |-
  Changes the password for the specified database user.

  The database name must be the full name returned by the list databases endpoint.
  The password must also be updated in any website configuration that uses this database.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/databases/:name/change-password"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: name
    value: <string>
    description: (Required) Full database name as returned by the list databases endpoint.
body:
  type: json
  content: |-
    {
      "password": "<string>"
    }
settings: {}
examples: ./.resources/Change database password.resources/examples
order: 1000
