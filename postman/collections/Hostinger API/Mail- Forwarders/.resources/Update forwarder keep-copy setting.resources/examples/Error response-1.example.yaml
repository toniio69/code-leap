$kind: http-example
name: Error response
request:
  url: "{{baseUrl}}/api/mail/v1/forwarders/:forwarderId/keep-copy"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: forwarderId
      value: <string>
      description: (Required) Forwarder resource ID
  body:
    type: json
    content: |-
      {
        "is_keep_copy_enabled": "<boolean>"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 4000
