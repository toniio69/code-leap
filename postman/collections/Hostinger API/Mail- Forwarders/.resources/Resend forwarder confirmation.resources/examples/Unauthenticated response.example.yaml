$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/forwarders/:forwarderId/confirmation/resend"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: forwarderId
      value: <string>
      description: (Required) Forwarder resource ID
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
