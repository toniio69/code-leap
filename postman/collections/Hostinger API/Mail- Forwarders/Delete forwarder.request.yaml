$kind: http-request
description: |-
  Delete a forwarder. The mailbox stops forwarding messages to the
  destination address immediately.
url: "{{baseUrl}}/api/mail/v1/forwarders/:forwarderId"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: forwarderId
    value: <string>
    description: (Required) Forwarder resource ID
settings: {}
examples: ./.resources/Delete forwarder.resources/examples
order: 2000
