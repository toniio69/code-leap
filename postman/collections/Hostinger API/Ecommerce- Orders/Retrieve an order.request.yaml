$kind: http-request
description: |-
  Retrieve one order in full: line items (each with the id the fulfil endpoint needs),
  addresses, the totals breakdown and fulfilments with tracking. Amounts are in the
  smallest currency unit.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/orders/:order_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store that owns the order.
  - key: order_id
    value: <string>
    description: (Required) The ID of the order to retrieve.
settings: {}
examples: ./.resources/Retrieve an order.resources/examples
order: 4000
