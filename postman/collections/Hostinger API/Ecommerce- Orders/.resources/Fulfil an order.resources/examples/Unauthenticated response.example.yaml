$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/orders/:order_id/fulfill"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store that owns the order.
    - key: order_id
      value: <string>
      description: (Required) The ID of the order to fulfil.
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "line_item_id": "<string>",
            "quantity": "<integer>"
          },
          {
            "line_item_id": "<string>",
            "quantity": "<integer>"
          }
        ],
        "tracking_number": "<string>",
        "tracking_url": "<string>",
        "notify_customer": "<boolean>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
