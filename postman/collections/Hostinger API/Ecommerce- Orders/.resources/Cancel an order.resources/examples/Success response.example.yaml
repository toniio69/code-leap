$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/orders/:order_id/cancel"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store that owns the order.
    - key: order_id
      value: <string>
      description: (Required) The ID of the order to cancel.
  body:
    type: json
    content: |-
      {
        "notify_customer": "<boolean>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "<string>",
          "display_id": "<integer>",
          "status": "<string>",
          "payment_status": "<string>",
          "fulfillment_status": "<string>",
          "total": "<integer>",
          "currency_code": "<string>",
          "customer_email": "<string>",
          "item_count": "<integer>",
          "created_at": "<dateTime>"
        }
      }
order: 1000
