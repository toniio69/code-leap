$kind: http-request
description: |-
  List a store's orders newest first as summaries. Filter by status, payment or fulfilment
  status, customer email, order number or a free-text query. Amounts are in the smallest
  currency unit. Retrieve a single order for its line items, addresses and fulfilments.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/orders?status=requires_action&status=canceled&payment_status=not_paid&payment_status=not_required&fulfillment_status=canceled&fulfillment_status=canceled&email=<string>&display_id=<string>&q=<string>&created_at_from=<string>&created_at_to=<string>&page=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: status
    value: requires_action
    description: Order statuses to include.
  - key: status
    value: canceled
    description: Order statuses to include.
  - key: payment_status
    value: not_paid
    description: Payment statuses to include. A paid order is "captured".
  - key: payment_status
    value: not_required
    description: Payment statuses to include. A paid order is "captured".
  - key: fulfillment_status
    value: canceled
    description: Fulfilment statuses to include.
  - key: fulfillment_status
    value: canceled
    description: Fulfilment statuses to include.
  - key: email
    value: <string>
    description: Customer email, matched exactly.
  - key: display_id
    value: <string>
    description: The order number the merchant and customer see.
  - key: q
    value: <string>
    description: Free-text search over customer name, email, order number and line items.
  - key: created_at_from
    value: <string>
    description: Earliest creation time to include, inclusive. Accepts a date or ISO date-time (UTC).
  - key: created_at_to
    value: <string>
    description: Latest creation time to include, inclusive. A bare date covers that whole day.
  - key: page
    value: <integer>
    description: Page number
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store to list orders for.
settings: {}
examples: ./.resources/List store orders.resources/examples
order: 3000
