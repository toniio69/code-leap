$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/orders/:orderId/logs/outbound?account=<email>&date=<date>&from_date=<dateTime>&to_date=<dateTime>&status=Failed&sender=<string>&recipient=<string>&page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: account
      value: <email>
      description: Filter log entries by a specific email account
    - key: date
      value: <date>
      description: Exact date filter (YYYY-MM-DD). Takes precedence over `from_date`/`to_date` when both are given.
    - key: from_date
      value: <dateTime>
      description: Date range start (RFC 3339)
    - key: to_date
      value: <dateTime>
      description: Date range end (RFC 3339)
    - key: status
      value: Failed
      description: Filter log entries by status (This can only be one of Successful,Failed)
    - key: sender
      value: <string>
      description: Filter log entries by sender. Accepts a full email address or a domain.
    - key: recipient
      value: <string>
      description: Filter log entries by recipient. Accepts a full email address or a domain.
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
  pathVariables:
    - key: orderId
      value: <string>
      description: (Required) Order resource ID
