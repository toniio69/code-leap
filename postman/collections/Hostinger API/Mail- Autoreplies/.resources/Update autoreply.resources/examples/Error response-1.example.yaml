$kind: http-example
name: Error response
request:
  url: "{{baseUrl}}/api/mail/v1/autoreplies/:autoreplyId"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: autoreplyId
      value: <string>
      description: (Required) Autoreply resource ID
  body:
    type: json
    content: |-
      {
        "subject": "<string>",
        "body": "<string>",
        "display_name": "<string>",
        "starts_at": "<dateTime>",
        "ends_at": "<dateTime>"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 4000
