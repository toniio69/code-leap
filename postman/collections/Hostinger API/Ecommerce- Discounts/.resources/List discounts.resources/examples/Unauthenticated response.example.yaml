$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/discounts?q=<string>&is_disabled=false&page=<integer>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: q
      value: <string>
      description: Free-text search over discount code and name.
    - key: is_disabled
      value: "false"
      description: Filter by disabled state. (This can only be one of true,false)
    - key: page
      value: <integer>
      description: Page number
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store to list discounts for.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
