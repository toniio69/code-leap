$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/discounts"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store to create the discount for.
  body:
    type: json
    content: |-
      {
        "code": "<string>",
        "type": "percentage",
        "value": "<integer>",
        "name": "<string>",
        "allocation": "item",
        "starts_at": "<dateTime>",
        "ends_at": "<dateTime>",
        "usage_limit": "<integer>",
        "min_cart_value": "<integer>",
        "time_zone": "<string>"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "errors": {
          "field_1": [
            "",
            ""
          ],
          "field_2": [
            "",
            ""
          ]
        },
        "correlation_id": "<string>"
      }
order: 3000
