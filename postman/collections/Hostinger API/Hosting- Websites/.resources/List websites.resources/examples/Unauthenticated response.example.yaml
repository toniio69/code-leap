$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/websites?page=<integer>&per_page=25&username=<string>&order_id=<integer>&is_enabled=<boolean>&domain=<string>&website_types=other,other"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
    - key: username
      value: <string>
      description: Filter by specific username
    - key: order_id
      value: <integer>
      description: Order ID
    - key: is_enabled
      value: <boolean>
      description: Filter by enabled status
    - key: domain
      value: <string>
      description: Filter by domain name (case-insensitive substring match)
    - key: website_types
      value: other,other
      description: Filter by detected website type, e.g. wordpress,nodejs. Accepts a comma-separated list.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
