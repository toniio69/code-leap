$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/onboardings?domain=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: domain
      value: <string>
      description: Filter by domain name (exact match)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "domain": "<string>",
          "username": "<string>",
          "status": "completed",
          "created_at": "<dateTime>",
          "updated_at": "<dateTime>"
        },
        {
          "domain": "<string>",
          "username": "<string>",
          "status": "running",
          "created_at": "<dateTime>",
          "updated_at": "<dateTime>"
        }
      ]
order: 1000
