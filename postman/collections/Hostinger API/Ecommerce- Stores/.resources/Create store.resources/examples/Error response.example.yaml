$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "country_code": "<string>",
        "company_email": "<string>",
        "company_name": "<string>",
        "language": "<string>",
        "sales_channel": {
          "type": "custom",
          "external_id": "<string>"
        }
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 4000
