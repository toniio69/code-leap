$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/metadata"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store to read metadata for.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "metadata": {
          "has_payment_methods": "<boolean>",
          "has_shipping": "<boolean>",
          "default_currency_code": "<string>",
          "default_currency": {
            "code": "<string>",
            "symbol": "<string>",
            "symbol_native": "<string>",
            "name": "<string>",
            "name_plural": "<string>",
            "decimal_digits": "<integer>",
            "rounding": "<number>",
            "template": "<string>",
            "min_amount": "<number>"
          }
        }
      }
order: 1000
