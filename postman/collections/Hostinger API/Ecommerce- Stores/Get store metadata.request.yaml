$kind: http-request
description: |-
  Get a store's readiness metadata: whether payment methods and shipping are configured,
  plus its default currency. Useful to verify prerequisites before building a storefront.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/metadata"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store to read metadata for.
settings: {}
examples: ./.resources/Get store metadata.resources/examples
order: 4000
