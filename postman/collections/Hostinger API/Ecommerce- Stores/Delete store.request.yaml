$kind: http-request
description: |-
  Soft-delete a store owned by your account.

  The underlying store data is preserved; only the store is marked as deleted.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store to delete.
settings: {}
examples: ./.resources/Delete store.resources/examples
order: 1000
