$kind: http-request
description: |-
  Returns the output captured from the last execution of the cron job identified by its uid.

  The uid is returned by the list cron jobs endpoint.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/cron-jobs/:uid/output"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: uid
    value: <string>
    description: (Required) Unique identifier of the cron job as returned by the list cron jobs endpoint.
settings: {}
examples: ./.resources/Get cron job output.resources/examples
order: 4000
