$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/cron-jobs/:uid/output"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: uid
      value: <string>
      description: (Required) Unique identifier of the cron job as returned by the list cron jobs endpoint.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
