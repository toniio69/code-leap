$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/websites/:website_uid/cron-jobs?page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
  pathVariables:
    - key: website_uid
      value: <string>
      description: (Required) Agency Plan website UID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
