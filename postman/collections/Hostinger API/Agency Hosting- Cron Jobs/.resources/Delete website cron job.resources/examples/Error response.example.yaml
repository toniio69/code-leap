$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/websites/:website_uid/cron-jobs/:uuid"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: website_uid
      value: <string>
      description: (Required) Agency Plan website UID
    - key: uuid
      value: <uuid>
      description: (Required) Unique identifier of the cron job as returned by the list cron jobs endpoint.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
