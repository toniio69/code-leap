$kind: http-request
description: Enable a manual payment method so the store can accept orders without an online payment provider.
url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/payment-methods/manual"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: store_id
    value: <string>
    description: (Required) The ID of the store to enable manual payment for.
body:
  type: json
  content: |-
    {
      "title": "<string>"
    }
settings: {}
examples: ./.resources/Enable manual payment method.resources/examples
order: 1000
