$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/payment-methods/manual"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store to enable manual payment for.
  body:
    type: json
    content: |-
      {
        "title": "<string>"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "payment_method": {
          "id": "<string>",
          "provider_id": "<string>",
          "is_enabled": "<boolean>",
          "title": "<string>"
        },
        "admin_url": "<string>"
      }
order: 1000
