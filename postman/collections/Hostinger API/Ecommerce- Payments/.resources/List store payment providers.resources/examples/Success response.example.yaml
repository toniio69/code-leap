$kind: http-example
request:
  url: "{{baseUrl}}/api/ecommerce/v1/stores/:store_id/payment-providers?include_currency_unsupported=<boolean>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: include_currency_unsupported
      value: <boolean>
      description: Include gateways that do not support the store currency in the available list.
  pathVariables:
    - key: store_id
      value: <string>
      description: (Required) The ID of the store to list payment providers for.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "connected": [
            {
              "id": "<string>",
              "provider_id": "<string>",
              "title": "<string>",
              "is_enabled": "<boolean>",
              "status": "connected",
              "shows_at_checkout": "<boolean>"
            },
            {
              "id": "<string>",
              "provider_id": "<string>",
              "title": "<string>",
              "is_enabled": "<boolean>",
              "status": "invalid",
              "shows_at_checkout": "<boolean>"
            }
          ],
          "available": [
            {
              "id": "<string>",
              "is_installed": "<boolean>",
              "is_enabled": "<boolean>",
              "is_currency_supported": "<boolean>",
              "supported_currencies": [
                "<string>",
