$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/mailboxes/:mailboxId/catchalls"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: mailboxId
      value: <string>
      description: (Required) Mailbox resource ID
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<string>",
        "mailbox": {
          "id": "<string>",
          "address": "<string>"
        },
        "domain": "<string>",
        "is_active": "<boolean>",
        "is_confirmed": "<boolean>",
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>"
      }
order: 1000
