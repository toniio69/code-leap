$kind: http-example
name: Error response
request:
  url: "{{baseUrl}}/api/mail/v1/catchalls/:catchallId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: catchallId
      value: <string>
      description: (Required) Catch-all resource ID
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 5000
