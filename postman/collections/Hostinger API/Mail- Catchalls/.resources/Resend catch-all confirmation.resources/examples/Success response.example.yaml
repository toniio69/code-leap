$kind: http-example
request:
  url: "{{baseUrl}}/api/mail/v1/catchalls/:catchallId/confirmation/resend"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: catchallId
      value: <string>
      description: (Required) Catch-all resource ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 1000
