$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/orders/:order_id/websites/setups"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: order_id
      value: <integer>
      description: (Required) Agency Plan order ID
  body:
    type: json
    content: |-
      {
        "datacenter_code": "<string>",
        "flavor": "wp-30.584211380",
        "settings": {
          "php": {
            "version": "<string>"
          }
        },
        "domain": "<string>",
        "type": "node-static",
        "wordpress": {
          "language": "<string>",
          "title": "<string>",
          "admin": {
            "user": "<string>",
            "password": "<string>",
            "email": "<string>"
          }
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "setup_uuid": "<string>"
      }
order: 1000
