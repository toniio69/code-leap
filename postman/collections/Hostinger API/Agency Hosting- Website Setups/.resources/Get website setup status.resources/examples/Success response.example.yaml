$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/orders/:order_id/websites/setups/:setup_uuid"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: order_id
      value: <integer>
      description: (Required) Agency Plan order ID
    - key: setup_uuid
      value: <uuid>
      description: (Required) Website setup UUID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "website_uid": "<string>",
        "status": "completed"
      }
order: 1000
