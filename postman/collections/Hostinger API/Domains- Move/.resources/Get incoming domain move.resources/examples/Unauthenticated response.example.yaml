$kind: http-example
request:
  url: "{{baseUrl}}/api/domains/v1/move/incoming/:domain?force_sync=false"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: force_sync
      value: "false"
      description: Re-check the move against the registry before responding. Only has an effect while the move is in the `activating` status.
  pathVariables:
    - key: domain
      value: <string>
      description: (Required) Domain name
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
