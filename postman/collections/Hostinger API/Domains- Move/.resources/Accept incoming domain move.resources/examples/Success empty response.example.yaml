$kind: http-example
request:
  url: "{{baseUrl}}/api/domains/v1/move/incoming/:domain"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: domain
      value: <string>
      description: (Required) Domain name
  body:
    type: json
    content: |-
      {
        "domain_contacts": {
          "owner_id": "<integer>",
          "admin_id": "<integer>",
          "billing_id": "<integer>",
          "tech_id": "<integer>"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 1000
