$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/domains/:domain/files?directory=&max_depth=5&max_items=1000&offset=0&file_types=other,other"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: directory
      value: ""
      description: Directory path to check
    - key: max_depth
      value: "5"
      description: How many directory levels deep to recurse.
    - key: max_items
      value: "1000"
      description: Max number of entries to return in this page.
    - key: offset
      value: "0"
      description: Number of entries to skip. Page with offset + item count until reaching total_items.
    - key: file_types
      value: other,other
      description: Filter by entry type, e.g. file,directory. Omit for all types.
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: domain
      value: <string>
      description: (Required) Domain name
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "path": "<string>",
        "items": [
          {
            "name": "<string>",
            "path": "<string>",
            "type": "directory",
            "size_bytes": "<integer>"
          },
          {
            "name": "<string>",
            "path": "<string>",
            "type": "directory",
            "size_bytes": "<integer>"
          }
        ],
        "total_items": "<integer>",
        "total_items_current_page": "<integer>",
        "offset": "<integer>"
      }
order: 1000
