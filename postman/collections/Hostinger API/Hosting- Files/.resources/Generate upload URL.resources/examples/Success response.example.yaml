$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/files/upload-urls"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "username": "<string>",
        "domain": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "url": "<string>",
        "auth_key": "<string>",
        "rest_auth_key": "<string>"
      }
order: 1000
