$kind: http-request
description: |-
  List files and directories under a website's document root.

  Use `directory` to browse a subdirectory relative to the document root. Symlinked entries
  are listed but never traversed into or resolved.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/domains/:domain/files?directory=&max_depth=5&max_items=1000&offset=0&file_types=other,other"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: directory
    value: ""
    description: Directory path to check
  - key: max_depth
    value: "5"
    description: How many directory levels deep to recurse.
  - key: max_items
    value: "1000"
    description: Max number of entries to return in this page.
  - key: offset
    value: "0"
    description: Number of entries to skip. Page with offset + item count until reaching total_items.
  - key: file_types
    value: other,other
    description: Filter by entry type, e.g. file,directory. Omit for all types.
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: domain
    value: <string>
    description: (Required) Domain name
settings: {}
examples: ./.resources/List website files and directories.resources/examples
order: 2000
