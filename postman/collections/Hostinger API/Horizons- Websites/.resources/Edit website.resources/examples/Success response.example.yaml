$kind: http-example
request:
  url: "{{baseUrl}}/api/horizons/v1/websites/:websiteId/messages"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: websiteId
      value: <string>
      description: (Required) The website ID
  body:
    type: json
    content: |-
      {
        "message": [
          {
            "type": "text",
            "text": "<string>"
          },
          {
            "type": "text",
            "text": "<string>"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "website_url": "<string>",
        "website_id": "<string>"
      }
order: 1000
