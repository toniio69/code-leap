$kind: http-example
request:
  url: "{{baseUrl}}/api/horizons/v1/websites/:websiteId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: websiteId
      value: <string>
      description: (Required) The website ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "website_url": "<string>"
      }
order: 1000
