$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/automations/:automationUuid"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
    - key: automationUuid
      value: <string>
      description: (Required) Automation uuid parameter
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "<string>",
        "name": "<string>",
        "status": "draft",
        "type": "ecommerce_abandoned_cart",
        "config": {},
        "events": {
          "started": "<integer>",
          "in_progress": "<integer>",
          "completed": "<integer>",
          "failed": "<integer>"
        },
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>"
      }
order: 1000
