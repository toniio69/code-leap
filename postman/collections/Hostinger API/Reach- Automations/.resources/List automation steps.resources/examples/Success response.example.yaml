$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/automations/:automationUuid/steps"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
    - key: automationUuid
      value: <string>
      description: (Required) Automation uuid parameter
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "uuid": "<string>",
          "parent_uuid": "<string>",
          "step_order": "<integer>",
          "type": "trigger",
          "value": "send_campaign",
          "config": {}
        },
        {
          "uuid": "<string>",
          "parent_uuid": "<string>",
          "step_order": "<integer>",
          "type": "action",
          "value": "form_submitted",
          "config": {}
        }
      ]
order: 1000
