$kind: http-request
description: |-
  Get a paginated list of the automations in a profile.

  Every automation comes with the counts of contacts that entered it, are moving through it,
  finished it or failed on the way. Those counts describe the contact journey and are not
  email engagement metrics - for opens, clicks and unsubscribes use the campaign statistics
  endpoint instead.
url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/automations?status=active&sort_direction=desc&page=<integer>&per_page=25"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: status
    value: active
    description: |-
      Filter automations by status.

      There is no `completed` status. An automation that has finished for every contact still
      reports `active`. (This can only be one of active,paused,draft)
  - key: sort_direction
    value: desc
    description: Order automations by creation date. Newest first unless set to `asc`. (This can only be one of asc,desc)
  - key: page
    value: <integer>
    description: Page number
  - key: per_page
    value: "25"
    description: Number of items per page
pathVariables:
  - key: profileUuid
    value: <string>
    description: (Required) Profile uuid parameter
settings: {}
examples: ./.resources/List automations.resources/examples
order: 2000
