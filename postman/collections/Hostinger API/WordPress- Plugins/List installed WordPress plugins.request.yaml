$kind: http-request
description: |-
  List plugins installed on a WordPress installation, including their status,
  available updates and known vulnerabilities.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/plugins?category=cache"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: category
    value: cache
    description: Filter installed plugins by category. (This can only be one of cache)
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
settings: {}
examples: ./.resources/List installed WordPress plugins.resources/examples
order: 6000
