$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/wordpress/plugins/is-woocommerce-installed?domain=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: domain
      value: <string>
      description: Filter by domain name (case-insensitive substring match)
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
