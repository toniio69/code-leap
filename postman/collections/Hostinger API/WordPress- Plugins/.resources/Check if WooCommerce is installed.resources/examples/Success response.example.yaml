$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/wordpress/plugins/is-woocommerce-installed?domain=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: domain
      value: <string>
      description: Filter by domain name (case-insensitive substring match)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "is_installed": "<boolean>"
      }
order: 1000
