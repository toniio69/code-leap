$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/plugins?category=cache"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: category
      value: cache
      description: Filter installed plugins by category. (This can only be one of cache)
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: software
      value: "98"
      description: (Required) WordPress installation (software) identifier
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
