$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/wordpress/plugins?search=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: search
      value: <string>
      description: (Required) Search term to match against plugin names. Minimum 3 characters.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "slug": "<string>",
          "title": "<string>",
          "icons": {
            "1x": "<string>",
            "2x": "<string>"
          },
          "description": "<string>"
        },
        {
          "slug": "<string>",
          "title": "<string>",
          "icons": {
            "1x": "<string>",
            "2x": "<string>"
          },
          "description": "<string>"
        }
      ]
order: 1000
