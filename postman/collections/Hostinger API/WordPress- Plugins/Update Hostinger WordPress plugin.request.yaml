$kind: http-request
description: |-
  Update a Hostinger plugin to its latest version on a WordPress installation.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).

  This operation is asynchronous: a successful response only means the update job
  has been queued.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/plugins/hostinger/update"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
body:
  type: json
  content: |-
    {
      "slug": "hostinger-reach"
    }
settings: {}
examples: ./.resources/Update Hostinger WordPress plugin.resources/examples
order: 11000
