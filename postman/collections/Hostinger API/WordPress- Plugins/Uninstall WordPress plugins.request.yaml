$kind: http-request
description: |-
  Uninstall one or more plugins from a WordPress installation.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).

  This operation is asynchronous: a successful response only means the uninstall
  job has been queued.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/plugins/uninstall"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
body:
  type: json
  content: |-
    {
      "plugins": [
        "<string>"
      ]
    }
settings: {}
examples: ./.resources/Uninstall WordPress plugins.resources/examples
order: 10000
