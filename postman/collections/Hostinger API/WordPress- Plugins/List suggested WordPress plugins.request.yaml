$kind: http-request
description: |-
  List curated plugin suggestions grouped by website type.

  Use the returned `slug` values with
  POST /api/hosting/v1/accounts/{username}/wordpress/{software}/plugins/install.
url: "{{baseUrl}}/api/hosting/v1/wordpress/plugins/suggested?order_id=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: order_id
    value: <integer>
    description: Optionally scope suggestions to a specific order.
settings: {}
examples: ./.resources/List suggested WordPress plugins.resources/examples
order: 8000
