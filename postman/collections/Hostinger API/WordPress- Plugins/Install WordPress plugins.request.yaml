$kind: http-request
description: |-
  Install one or more plugins on an existing WordPress installation.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id`
  field). Use GET /api/hosting/v1/wordpress/plugins to discover the plugin
  slugs available for installation.

  This operation is asynchronous: a successful response only means the install
  job has been queued, not that the plugins are ready.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/plugins/install"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
body:
  type: json
  content: |-
    {
      "plugins": [
        "<string>"
      ]
    }
settings: {}
examples: ./.resources/Install WordPress plugins.resources/examples
order: 4000
