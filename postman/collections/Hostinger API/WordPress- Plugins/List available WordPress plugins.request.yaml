$kind: http-request
description: |-
  List plugins recommended for installation on a WordPress installation that are
  not yet installed.

  Provide the WordPress installation (software) identifier in the path. It can
  be obtained from GET /api/hosting/v1/wordpress/installations (the `id` field).
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/wordpress/:software/plugins/available"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: software
    value: "98"
    description: (Required) WordPress installation (software) identifier
settings: {}
examples: ./.resources/List available WordPress plugins.resources/examples
order: 5000
