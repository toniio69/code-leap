$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/contacts/:contactUuid"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
    - key: contactUuid
      value: <uuid>
      description: (Required) Contact uuid parameter
  body:
    type: json
    content: |-
      {
        "email": "<string>",
        "name": "<string>",
        "surname": "<string>",
        "phone": "<string>",
        "subscription_status": "pending",
        "note": "<string>",
        "fields": [
          {
            "uuid": "<string>",
            "value": "<string>",
            "selected_option_uuids": [
              "<string>",
              "<string>"
            ]
          },
          {
            "uuid": "<string>",
            "value": "<string>",
            "selected_option_uuids": [
              "<string>",
              "<string>"
            ]
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "<string>",
        "name": "<string>",
        "surname": "<string>",
        "email": "<string>",
        "phone": "<string>",
        "subscription_status": "unsubscribed",
        "subscribed_at": "<dateTime>",
        "unsubscribed_at": "<dateTime>"
      }
order: 1000
