$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/contacts?subscription_status=unsubscribed&tag_uuid=<uuid>&search=<string>&page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: subscription_status
      value: unsubscribed
      description: Filter contacts by subscription status (This can only be one of subscribed,unsubscribed,confirmed,pending)
    - key: tag_uuid
      value: <uuid>
      description: Filter contacts by tag UUID
    - key: search
      value: <string>
      description: Search contacts by email
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
