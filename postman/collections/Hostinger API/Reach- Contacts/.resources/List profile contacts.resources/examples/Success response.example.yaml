$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/contacts?subscription_status=unsubscribed&tag_uuid=<uuid>&search=<string>&page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: subscription_status
      value: unsubscribed
      description: Filter contacts by subscription status (This can only be one of subscribed,unsubscribed,confirmed,pending)
    - key: tag_uuid
      value: <uuid>
      description: Filter contacts by tag UUID
    - key: search
      value: <string>
      description: Search contacts by email
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "uuid": "<string>",
            "name": "<string>",
            "surname": "<string>",
            "email": "<string>",
            "phone": "<string>",
            "subscription_status": "confirmed",
            "subscribed_at": "<dateTime>",
            "unsubscribed_at": "<dateTime>",
            "source": "horizons",
            "note": "<string>"
          },
          {
            "uuid": "<string>",
            "name": "<string>",
            "surname": "<string>",
            "email": "<string>",
            "phone": "<string>",
            "subscription_status": "pending",
            "subscribed_at": "<dateTime>",
            "unsubscribed_at": "<dateTime>",
            "source": "import",
            "note": "<string>"
          }
        ],
        "meta": {
          "current_page": "<integer>",
          "per_page": "<integer>",
          "total": "<integer>"
        }
      }
order: 1000
