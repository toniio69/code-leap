$kind: http-request
description: |-
  Get the full details of a single contact.

  Alongside the contact's own attributes this returns the tags assigned to it and the
  values it holds for the profile's custom contact fields.
url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/contacts/:contactUuid"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: profileUuid
    value: <string>
    description: (Required) Profile uuid parameter
  - key: contactUuid
    value: <uuid>
    description: (Required) Contact uuid parameter
settings: {}
examples: ./.resources/Get contact details.resources/examples
order: 5000
