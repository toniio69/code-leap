$kind: http-request
description: |-
  Create a new contact in the email marketing system.

  This endpoint allows you to create a new contact with basic information like name, email, and surname.

  If double opt-in is enabled, the contact will be created with a pending status
  and a confirmation email will be sent.
url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/contacts"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: profileUuid
    value: <string>
    description: (Required) Profile uuid parameter
body:
  type: json
  content: |-
    {
      "email": "<string>",
      "name": "<string>",
      "surname": "<string>",
      "phone": "<string>",
      "note": "<string>",
      "tag_uuids": [
        "<string>",
        "<string>"
      ]
    }
settings: {}
examples: ./.resources/Create new contacts.resources/examples
order: 10000
