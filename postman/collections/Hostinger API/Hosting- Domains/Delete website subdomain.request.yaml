$kind: http-request
description: |-
  Delete an existing subdomain from the selected website.

  Use this endpoint to remove subdomains that are no longer needed.
url: "{{baseUrl}}/api/hosting/v1/accounts/:username/websites/:domain/subdomains/:subdomain"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: username
    value: <string>
    description: "(Required) "
  - key: domain
    value: <string>
    description: (Required) Domain name
  - key: subdomain
    value: <string>
    description: "(Required) "
settings: {}
examples: ./.resources/Delete website subdomain.resources/examples
order: 7000
