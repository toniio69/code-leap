$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/websites/:domain/subdomains"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: domain
      value: <string>
      description: (Required) Domain name
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "username": "<string>",
          "domain": "<string>",
          "parent_domain": "<string>",
          "root_directory": "<string>",
          "subdomain": "<string>"
        },
        {
          "username": "<string>",
          "domain": "<string>",
          "parent_domain": "<string>",
          "root_directory": "<string>",
          "subdomain": "<string>"
        }
      ]
order: 1000
