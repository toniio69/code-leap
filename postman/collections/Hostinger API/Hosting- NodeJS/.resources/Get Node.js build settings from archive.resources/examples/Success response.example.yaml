$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/websites/:domain/nodejs/builds/settings/from-archive?archive_path=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: archive_path
      value: <string>
      description: (Required) The path to the archive file relative to the document root of the vhost
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: domain
      value: <string>
      description: (Required) Domain name
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "app_type": "vue",
        "node_version": "<integer>",
        "root_directory": "<string>",
        "output_directory": "<string>",
        "build_script": "<string>",
        "entry_file": "<string>",
        "package_manager": "npm",
        "available_scripts": [
          "<string>",
          "<string>"
        ]
      }
order: 1000
