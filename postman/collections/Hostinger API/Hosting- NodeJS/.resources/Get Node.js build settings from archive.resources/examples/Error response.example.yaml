$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/websites/:domain/nodejs/builds/settings/from-archive?archive_path=<string>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: archive_path
      value: <string>
      description: (Required) The path to the archive file relative to the document root of the vhost
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: domain
      value: <string>
      description: (Required) Domain name
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 4000
