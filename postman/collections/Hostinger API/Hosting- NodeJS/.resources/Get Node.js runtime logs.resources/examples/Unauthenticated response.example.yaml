$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/accounts/:username/websites/:domain/nodejs/runtime-logs?period=1d&from_line=<integer>&limit=1000&levels=LOG,WARN"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: period
      value: 1d
      description: Time window for the first fetch. Required when `from_line` is not sent. (This can only be one of 1h,1d,1w,1m)
    - key: from_line
      value: <integer>
      description: |-
        1-based line of the log file to start from. For polling send `total_lines + 1` from the
        previous response. Cannot be combined with `period`.
    - key: limit
      value: "1000"
      description: Maximum number of log entries to return. When more entries match, the newest are kept.
    - key: levels
      value: LOG,WARN
      description: |-
        Return only entries with these log levels, sent as a comma-separated list, e.g. ERROR,WARN.
        Matching runs on the raw log line, so entries written with numeric levels (for example by
        pino) are excluded while this filter is set.
  pathVariables:
    - key: username
      value: <string>
      description: "(Required) "
    - key: domain
      value: <string>
      description: (Required) Domain name
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
