$kind: http-example
request:
  url: "{{baseUrl}}/api/billing/v1/orders"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "item_id": "<string>",
            "quantity": 1
          },
          {
            "item_id": "<string>",
            "quantity": 1
          }
        ],
        "payment_method_id": "<integer>",
        "coupons": [
          "",
          ""
        ]
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
