$kind: http-example
request:
  url: "{{baseUrl}}/api/agency-hosting/v1/websites/:website_uid/wordpress/settings"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: website_uid
      value: <string>
      description: (Required) Agency Plan website UID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "core_version": "<string>",
        "is_lite_speed_cache_enabled": "<boolean>",
        "is_object_cache_enabled": "<boolean>",
        "is_maintenance_mode_enabled": "<boolean>"
      }
order: 1000
