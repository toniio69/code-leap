$kind: http-request
description: Lists the WordPress core versions available for installation on an Agency Plan website.
url: "{{baseUrl}}/api/agency-hosting/v1/websites/:website_uid/wordpress/settings/versions"
method: GET
headers:
  Accept: application/json
pathVariables:
