$kind: http-request
description: Returns a paginated list of Agency Plan orders accessible to the authenticated client.
url: "{{baseUrl}}/api/agency-hosting/v1/orders?page=<integer>&per_page=25"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: Page number
  - key: per_page
    value: "25"
    description: Number of items per page
settings: {}
examples: ./.resources/List orders.resources/examples
order: 1000
