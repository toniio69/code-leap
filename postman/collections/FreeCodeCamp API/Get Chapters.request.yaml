$kind: graphql-request
name: Get Chapters
url: '{{fcc_api_url}}'
order: 3000
query: |-
  query ($superblockDashedName: String!) {
    chapters(superblockDashedName: $superblockDashedName) {
      dashedName
      modules {
        dashedName
        blocks
      }
    }
  }
variables: |-
  {
    "superblockDashedName": "responsive-web-design"
  }
