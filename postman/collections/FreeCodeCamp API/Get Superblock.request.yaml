$kind: graphql-request
name: Get Superblock
url: '{{fcc_api_url}}'
order: 2000
query: |-
  query ($dashedName: String!) {
    superblock(dashedName: $dashedName) {
      title
      blocks
      challenges {
        id
        title
      }
    }
  }
variables: |-
  {
    "dashedName": "responsive-web-design"
  }
